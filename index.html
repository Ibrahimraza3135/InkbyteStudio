<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InkbyteStudio - Under Maintenance</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
      }
      .card {
        background-color: rgba(30, 41, 59, 0.8);
        border: 1px solid rgba(51, 65, 85, 0.5);
        border-radius: 1rem;
        padding: 2rem;
        max-width: 28rem;
        width: 100%;
        text-align: center;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      }
      .icon-wrapper {
        width: 4rem;
        height: 4rem;
        background-color: rgba(37, 99, 235, 0.1);
        border: 1px solid rgba(59, 130, 246, 0.2);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.5rem;
      }
      .icon-wrapper svg {
        width: 2rem;
        height: 2rem;
        stroke: #3b82f6;
      }
      h1 {
        font-size: 1.875rem;
        font-weight: 700;
        margin-bottom: 0.75rem;
        letter-spacing: -0.025em;
      }
      p {
        color: #94a3b8;
        font-size: 0.95rem;
        line-height: 1.6;
        margin-bottom: 1.75rem;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background-color: rgba(59, 130, 246, 0.1);
        border: 1px solid rgba(59, 130, 246, 0.2);
        color: #60a5fa;
        padding: 0.375rem 0.875rem;
        border-radius: 9999px;
        font-size: 0.75rem;
        font-weight: 600;
      }
      .dot {
        width: 0.5rem;
        height: 0.5rem;
        background-color: #60a5fa;
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon-wrapper">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M11.42 15.17L17.25 21A2.652 2.652 0 0021 17.25l-5.83-5.83M11.42 15.17l2.496-3.03c.317-.384.74-.626 1.208-.766M11.42 15.17l-4.655 5.653a2.548 2.548 0 11-3.586-3.586l5.654-4.654m0 0l3.03-2.496c.14-.468.382-.891.766-1.208l5.83-5.83A2.652 2.652 0 0017.25 3l-5.83 5.83a2.652 2.652 0 00-.766 1.208l-2.496 3.03z" />
        </svg>
      </div>
      <h1>Under Maintenance</h1>
      <p>We are currently updating our website to improve our services. We'll be back online shortly!</p>
      <div class="badge">
        <span class="dot"></span>
        InkbyteStudio Team
      </div>
    </div>
  </body>
</html>
